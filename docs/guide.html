<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unicorn Pocket — Guide</title>

  <!-- Same CSP as pocket/index.html — script-src 'self' blocks injected scripts. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'none'" />

  <style>
    :root {
      --bg: #0b0b12;
      --surface: #16161f;
      --border: #2b2b3a;
      --text: #f2f2f7;
      --muted: #9a9ab0;
      --accent: #b388ff;
      --accent-2: #7c4dff;
      --radius: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.6;
    }

    body {
      padding: 0 0 env(safe-area-inset-bottom, 20px);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
      background: rgba(11, 11, 18, 0.88);
      backdrop-filter: saturate(160%) blur(14px);
      -webkit-backdrop-filter: saturate(160%) blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }
    .back-link:hover { text-decoration: underline; }

    .topbar-title {
      font-weight: 700;
      font-size: 17px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .content {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 18px 48px;
    }

    .loading {
      color: var(--muted);
      font-size: 15px;
      padding: 48px 0;
      text-align: center;
    }

    .error-card {
      background: var(--surface);
      border: 1px solid #ff6b6b;
      border-radius: var(--radius);
      padding: 18px;
      color: #ff6b6b;
      font-size: 15px;
    }

    /* ---------- rendered markdown ---------- */
    .content h1 { font-size: 28px; font-weight: 700; margin: 0 0 18px; line-height: 1.25; }
    .content h2 { font-size: 22px; font-weight: 700; margin: 32px 0 12px; line-height: 1.3; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .content h3 { font-size: 18px; font-weight: 600; margin: 24px 0 10px; }
    .content h4 { font-size: 16px; font-weight: 600; margin: 20px 0 8px; }
    .content h5, .content h6 { font-size: 15px; font-weight: 600; margin: 16px 0 6px; color: var(--muted); }

    .content p { margin: 0 0 14px; }

    .content a { color: var(--accent); text-decoration: none; }
    .content a:hover { text-decoration: underline; }

    .content code {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      background: rgba(179, 136, 255, 0.12);
      border: 1px solid rgba(179, 136, 255, 0.22);
      border-radius: 5px;
      padding: 2px 6px;
    }

    .content pre {
      background: #0e0e18;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      overflow-x: auto;
      margin: 0 0 16px;
      -webkit-overflow-scrolling: touch;
    }
    .content pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .content ul, .content ol {
      margin: 0 0 14px;
      padding-left: 24px;
    }
    .content li { margin-bottom: 6px; line-height: 1.55; }

    .content blockquote {
      border-left: 3px solid var(--accent-2);
      margin: 0 0 14px 0;
      padding: 10px 16px;
      background: rgba(124, 77, 255, 0.10);
      border-radius: 0 8px 8px 0;
    }
    .content blockquote p { margin: 0 0 6px; }
    .content blockquote p:last-child { margin: 0; }

    .content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    .content table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 16px;
      font-size: 14px;
      overflow-x: auto;
      display: block;
    }
    .content th {
      background: rgba(124, 77, 255, 0.14);
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
      border: 1px solid var(--border);
    }
    .content td {
      padding: 9px 12px;
      border: 1px solid var(--border);
      vertical-align: top;
    }
    .content tr:nth-child(even) td { background: rgba(255, 255, 255, 0.03); }

    .content strong { font-weight: 700; }
    .content em { font-style: italic; color: inherit; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back-link" href="../index.html">← Back to app</a>
    <span class="topbar-title" id="docTitle">Guide</span>
  </div>
  <div class="content" id="docContent">
    <div class="loading">Loading…</div>
  </div>

  <!-- Both external (script-src 'self'). An inline bootstrap would be CSP-blocked. -->
  <script src="guide.js"></script>
  <script src="guide-boot.js"></script>
</body>
</html>
